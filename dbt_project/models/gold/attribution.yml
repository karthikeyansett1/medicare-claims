version: 2
models:
- name: attribution_candidates
  description: Auditable retrospective attribution for eligible 2009/2010 member years;
    sample-aware keys and explicit unknown amounts.
  columns:
  - name: member_year_key
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_member_year')
          field: member_year_key
    description: Sample-aware annual member identity.
  - name: member_key
    description: Sample-aware member identity.
  - name: _sample_id
    description: CMS synthetic sample ID.
  - name: member_id
    description: Original synthetic beneficiary identifier.
  - name: year
    description: Performance calendar year, 2009 or 2010.
  - name: rendering_npi
    description: Observed synthetic rendering provider identifier, text.
  - name: professional_lines
    description: Number of professional fact lines for candidate.
  - name: service_days
    description: Distinct claim-from dates across all candidate professional lines.
  - name: office_visit_days
    description: Distinct claim-from dates on office E&M lines.
  - name: last_office_visit
    description: Most recent candidate office E&M date.
  - name: known_allowed_amt
    description: Sum of known allowed amounts; NULL if all amounts unknown.
  - name: known_allowed_lines
    description: Number of candidate lines with a known allowed amount.
  - name: missing_allowed_lines
    description: Number of candidate lines whose allowed amount is unknown.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - member_year_key
        - rendering_npi
- name: attribution_a
  description: Auditable retrospective attribution for eligible 2009/2010 member years;
    sample-aware keys and explicit unknown amounts.
  columns:
  - name: member_year_key
    data_tests:
    - not_null
    - relationships:
